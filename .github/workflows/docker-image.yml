name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
   
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag liatrio-apprentice:${{ github.run_number }}

    - name: Run the Docker container
      run: docker run -d -p 80:3000 liatrio-apprentice:${{ github.run_number }}

    - name: Run Apprentice Action
      uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91

  push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          IMAGE="${DOCKERHUB_USERNAME}/liatrio-apprentice:${IMAGE_TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image to push: ${IMAGE}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the Docker image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker build . --file Dockerfile --tag "$IMAGE"

      - name: Push the Docker image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push "$IMAGE"
    
  deploy:
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy the newly pushed Docker image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE: ${{ needs.push.outputs.image }}
        run: |
          set -euo pipefail

          echo "Deploying image: $IMAGE"

          gcloud run deploy go-api \
            --image="$IMAGE" \
            --region=us-central1 \
            --project="$PROJECT_ID" \
            --quiet

      - name: Verify deployment
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run services describe go-api \
            --region=us-central1 \
            --project="$PROJECT_ID" \
            --format="value(status.url)"